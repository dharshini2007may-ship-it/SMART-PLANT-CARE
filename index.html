<!DOCTYPE html>
<html>
<head>
    <title>Smart Plant Care</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🌱 Smart Plant Care</h1>

    <p>Take care of your plants easily!</p>

    <h2>➕ Add a Plant</h2>

    <input type="text" id="plantName" placeholder="Plant name">

    <br><br>

    <input type="date" id="waterDate">

    <br><br>

    <input type="number" id="days" placeholder="Water every how many days?">

    <br><br>

    <button onclick="addPlant()">Add Plant</button>

    <h2>🌿 My Plants</h2>

    <div id="plantList">
        <p>No plants added yet.</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
